name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build, or version label for a pre-tag dry run
        required: true
        type: string
      publish:
        description: Upload verified archives to the GitHub release after all checks pass
        default: false
        type: boolean
      source-ref:
        description: Optional commit or ref for a pre-tag dry run (publish must be false)
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact tagged source
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN_REF: ${{ inputs.source-ref }}
          PUBLICATION: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0" >&2
            exit 1
          fi
          if test -n "$DRY_RUN_REF"; then
            test "$PUBLICATION" = false || { echo "source-ref is for dry runs only" >&2; exit 1; }
            commit=$(git rev-parse --verify --end-of-options "$DRY_RUN_REF^{commit}")
          else
            commit=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
          fi
          echo "version=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/tree-sitter-qlik/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: source/tree-sitter-qlik
      - run: make check
        working-directory: source
      - run: python -m unittest discover -s automation/scripts -p 'test_*.py'

  skill:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      included: ${{ steps.package.outputs.included }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Package the tagged companion skill when present
        id: package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python automation/scripts/release.py skill --root source --output dist --version "$VERSION"
          if test -f "dist/qlik-code-intelligence-skill_${VERSION}.zip"; then
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            echo "included=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.package.outputs.included == 'true'
        with:
          name: release-skill
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: resolve
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin_arm64
            cc: clang
          - os: macos-15-intel
            target: darwin_amd64
            cc: clang
          - os: windows-2025
            target: windows_amd64
            cc: gcc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      CC: ${{ matrix.cc }}
    steps:
      - name: Preserve fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: source/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure native Windows CGO
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION "ucrt64/bin"
          if (!(Test-Path "$bin/gcc.exe")) { throw "UCRT64 GCC is missing" }
          "$bin" >> $env:GITHUB_PATH
          "CC=$bin/gcc.exe" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-static" >> $env:GITHUB_ENV
      - name: Adapt the original v0.1.0 Windows test harness
        if: runner.os == 'Windows' && needs.resolve.outputs.version == 'v0.1.0'
        shell: python
        run: |
          import json, os
          from pathlib import Path
          source = Path("source/internal/cli/integration_test.go").resolve()
          original = source.read_text(encoding="utf-8")
          before = 'filepath.Join(t.TempDir(), "qlik-repomap")'
          assert original.count(before) == 1, "unexpected v0.1.0 integration harness"
          patched = Path(os.environ["RUNNER_TEMP"]) / "integration_test.go"
          patched.write_text(original.replace(before, 'filepath.Join(t.TempDir(), "qlik-repomap.exe")'), encoding="utf-8")
          overlay = patched.with_suffix(".json")
          overlay.write_text(json.dumps({"Replace": {str(source): str(patched)}}), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TEST_OVERLAY={overlay}\n")
      - name: Test native source
        working-directory: source
        run: |
          go test -race -count=1 ./...
          overlay=()
          if test -n "${TEST_OVERLAY:-}"; then overlay=(-overlay "$TEST_OVERLAY"); fi
          go test "${overlay[@]}" -tags=integration -count=1 ./...
          go vet ./...
          git diff --exit-code
      - name: Package and test the extracted executable
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python automation/scripts/release.py package --root source --output dist --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, verify, build, skill]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and combine all archive checksums
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          WITH_SKILL: ${{ needs.skill.outputs.included }}
        run: |
          flags=()
          if test "$WITH_SKILL" = true; then flags+=(--with-skill); fi
          python scripts/release.py checksums --output dist --version "$VERSION" "${flags[@]}"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          remote=$(git ls-remote origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          commit=$(printf '%s\n' "$remote" | tail -1 | cut -f1)
          test "$commit" = "$SOURCE_COMMIT"
          if gh release view "$VERSION" --json assets > existing-release.json; then
            if test "$(gh release view "$VERSION" --json assets --jq '.assets | length')" != 0; then
              mkdir existing
              gh release download "$VERSION" --dir existing
              for file in dist/*; do cmp "$file" "existing/$(basename "$file")"; done
              echo "Identical assets already published"
              exit 0
            fi
          else
            flags=()
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$VERSION" --draft --verify-tag --title "$VERSION" --generate-notes "${flags[@]}"
          fi
          gh release upload "$VERSION" dist/*
          gh release edit "$VERSION" --draft=false
